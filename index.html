<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قەرزی کڕیار — چوونەژوورەوە</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/icons/icon-192.png" alt="قەرزی کڕیار" class="login-logo-img">
      </div>
      <div class="login-title">سیستەمی قەرزی کڕیار</div>
      <div class="login-sub">بەڕێوەبردنی قەرز و پارەدانەوە — ئۆنلاین</div>

      <div id="loginError" class="form-error"></div>
      <form id="loginForm">
        <div class="field">
          <label for="email">ئیمەیل</label>
          <input class="input" type="email" id="email" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">وشەی نهێنی</label>
          <div class="pw-wrap">
            <input class="input" type="password" id="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" tabindex="-1">👁️</button>
          </div>
        </div>
        <label class="remember"><input type="checkbox" id="rememberMe"> ناوم بیرت بێت</label>
        <button type="submit" class="btn btn-block" id="loginBtn">چوونەژوورەوە</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="assets/js/db.js"></script>
  <script>
    document.getElementById("pwToggle").addEventListener("click", () => {
      const p = document.getElementById("password"), t = document.getElementById("pwToggle");
      if (p.type === "password") { p.type = "text"; t.textContent = "🙈"; }
      else { p.type = "password"; t.textContent = "👁️"; }
    });

    // ئەگەر پێشتر چووبێتە ژوورەوە
    DB.onAuth((user) => { if (user) location.href = "app.html"; });

    // ناوم بیرت بێت — پڕکردنەوەی ئیمەیل ئەگەر پێشتر هەڵگیرابوو
    try {
      const savedEmail = localStorage.getItem("qarz_email");
      if (savedEmail) {
        document.getElementById("email").value = savedEmail;
        document.getElementById("rememberMe").checked = true;
        document.getElementById("password").focus();
      }
    } catch (_) {}

    const form = document.getElementById("loginForm");
    const errBox = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.remove("show");
      btn.disabled = true; btn.textContent = "چاوەڕوانبە...";
      const email = document.getElementById("email").value.trim();
      // هەڵگرتن/سڕینەوەی ئیمەیل بەپێی «ناوم بیرت بێت»
      try {
        if (document.getElementById("rememberMe").checked) localStorage.setItem("qarz_email", email);
        else localStorage.removeItem("qarz_email");
      } catch (_) {}
      try {
        await DB.login(email, document.getElementById("password").value);
        location.href = "app.html";
      } catch (err) {
        let msg = "ئیمەیل یان وشەی نهێنی هەڵەیە";
        if (err.code === "auth/too-many-requests") msg = "هەوڵی زۆر — کەمێک چاوەڕوانبە";
        errBox.textContent = msg; errBox.classList.add("show");
        btn.disabled = false; btn.textContent = "چوونەژوورەوە";
      }
    });
  </script>
  <script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
